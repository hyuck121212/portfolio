<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-label="Daegu EATMAP 추천 구조 도식: 제약 조건을 먼저 입력받아 먹을 수 없는 후보를 제거한 뒤, 남은 후보로 구역 점수를 산정해 최적 구역과 대안 구역을 제시한다.">
  <style>
    .t  { font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    .hd { font-size: 21px; font-weight: 700; fill: #16181d; }
    .bx { font-size: 24px; font-weight: 700; fill: #16181d; }
    .sm { font-size: 17px; fill: #565c66; }
    .wt { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 17px; fill: #cfe4f2; }
  </style>
  <rect width="800" height="500" fill="#f4f6fa"/>
  <text class="t hd" x="48" y="56">추천하기 전에 먼저 빼는 구조</text>

  <!-- 1 -->
  <rect x="48" y="86" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="80" y="106" width="76" height="36" rx="18" fill="#e2eef7"/>
    <circle cx="98" cy="124" r="7" fill="#0e6da8"/>
    <circle cx="118" cy="124" r="7" fill="#0e6da8" opacity=".6"/>
    <circle cx="138" cy="124" r="7" fill="#0e6da8" opacity=".35"/>
  </g>
  <text class="t bx" x="184" y="118">제약 조건 입력</text>
  <text class="t sm" x="184" y="145">종교 · 식단 · 알레르기 · 언어</text>

  <path d="M400 168 L400 190 M390 180 L400 192 L410 180" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <rect x="48" y="200" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <circle cx="94" cy="238" r="12" fill="#c9d0db"/>
    <circle cx="124" cy="238" r="12" fill="#c9d0db"/>
    <circle cx="154" cy="238" r="12" fill="#0e6da8"/>
    <line x1="83" y1="249" x2="105" y2="227" stroke="#8a93a3" stroke-width="3" stroke-linecap="round"/>
    <line x1="113" y1="249" x2="135" y2="227" stroke="#8a93a3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="t bx" x="184" y="232">먹을 수 없는 후보 제거</text>
  <text class="t sm" x="184" y="259">추천 이전 단계에서 걸러내 추정할 필요를 없앰</text>

  <path d="M400 282 L400 304 M390 294 L400 306 L410 294" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <rect x="48" y="314" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g fill="#0e6da8">
    <rect x="80" y="332" width="76" height="20" rx="4" opacity=".9"/>
    <rect x="80" y="357" width="26" height="14" rx="4" opacity=".5"/>
    <rect x="112" y="357" width="20" height="14" rx="4" opacity=".35"/>
  </g>
  <text class="t bx" x="184" y="346">구역 점수 산정</text>
  <text class="t sm" x="184" y="373">조건 충족 가게 수 0.7 + 거리 감쇠 + 리뷰 신뢰도</text>

  <path d="M400 396 L400 418 M390 408 L400 420 L410 408" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 -->
  <rect x="48" y="428" width="704" height="60" rx="12" fill="#0e6da8"/>
  <text class="t wt" x="80" y="457">최적 구역 + 대안 구역 제시</text>
  <text class="t ws" x="80" y="479">도보 5~10분 안에 선택지 3~5곳이 남는 범위</text>
</svg>
