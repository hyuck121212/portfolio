<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-label="우울증 예측 모델 개선 과정 도식: 환자 1503명 데이터로 로지스틱 회귀 86퍼센트와 딥러닝 89퍼센트를 비교한 뒤, 드롭아웃과 RMSprop으로 90퍼센트까지 올리고 설문 45명에 적용했다.">
  <style>
    .t  { font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    .hd { font-size: 21px; font-weight: 700; fill: #16181d; }
    .bx { font-size: 24px; font-weight: 700; fill: #16181d; }
    .sm { font-size: 17px; fill: #565c66; }
    .wt { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 17px; fill: #cfe4f2; }
    .nm { font-size: 15px; font-weight: 700; fill: #16181d; }
  </style>
  <rect width="800" height="500" fill="#f4f6fa"/>
  <text class="t hd" x="48" y="56">두 모델을 비교하고 개선하기</text>

  <!-- 1 -->
  <rect x="48" y="86" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g fill="#0e6da8">
    <circle cx="92" cy="118" r="7" opacity=".85"/><circle cx="112" cy="118" r="7" opacity=".65"/>
    <circle cx="132" cy="118" r="7" opacity=".45"/><circle cx="152" cy="118" r="7" opacity=".3"/>
    <circle cx="92" cy="138" r="7" opacity=".65"/><circle cx="112" cy="138" r="7" opacity=".45"/>
    <circle cx="132" cy="138" r="7" opacity=".3"/><circle cx="152" cy="138" r="7" opacity=".2"/>
  </g>
  <text class="t bx" x="184" y="118">환자 1,503명 · 9개 속성</text>
  <text class="t sm" x="184" y="145">슬픔 · 수면 · 집중력 · 식욕 · 죄책감 · 가족 문제 · 자살 시도</text>

  <path d="M400 168 L400 190 M390 180 L400 192 L410 180" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 : 비교 -->
  <rect x="48" y="200" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <text class="t bx" x="80" y="230">두 모델 비교</text>
  <g>
    <rect x="300" y="216" width="150" height="16" rx="8" fill="#e2e6ed"/>
    <rect x="300" y="216" width="107" height="16" rx="8" fill="#9aa3b2"/>
    <text class="t nm" x="462" y="230">로지스틱 회귀 86%</text>

    <rect x="300" y="244" width="150" height="16" rx="8" fill="#e2e6ed"/>
    <rect x="300" y="244" width="122" height="16" rx="8" fill="#0e6da8" opacity=".55"/>
    <text class="t nm" x="462" y="258">딥러닝 89% · 오차 0.30</text>
  </g>

  <path d="M400 282 L400 304 M390 294 L400 306 L410 294" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 : 개선 -->
  <rect x="48" y="314" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <text class="t bx" x="80" y="344">개선</text>
  <text class="t sm" x="80" y="370">드롭아웃 + RMSprop</text>
  <g>
    <rect x="300" y="336" width="150" height="16" rx="8" fill="#e2e6ed"/>
    <rect x="300" y="336" width="135" height="16" rx="8" fill="#0e6da8"/>
    <text class="t nm" x="462" y="350">90% · 오차 0.23</text>
  </g>
  <text class="t sm" x="300" y="376">과적합을 잡고 최적화 알고리즘을 Adam에서 바꿈</text>

  <path d="M400 396 L400 418 M390 408 L400 420 L410 408" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 -->
  <rect x="48" y="428" width="704" height="60" rx="12" fill="#0e6da8"/>
  <text class="t wt" x="80" y="457">설문 45명에 적용 → 29명 의심</text>
  <text class="t ws" x="80" y="479">웹사이트 · 포스터 제작 후 교내 캠페인까지 진행</text>
</svg>
