<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-label="감정 인식 파이프라인 도식: 음성 입력이 log-Mel 스펙트로그램으로 변환되고 CNN과 LSTM을 거쳐 16개 감정 클래스로 분류된다.">
  <style>
    .t  { font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    .hd { font-size: 21px; font-weight: 700; fill: #16181d; }
    .bx { font-size: 24px; font-weight: 700; fill: #16181d; }
    .sm { font-size: 17px; fill: #565c66; }
    .wt { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 17px; fill: #cfe4f2; }
  </style>
  <rect width="800" height="500" fill="#f4f6fa"/>
  <text class="t hd" x="48" y="56">감정 인식 파이프라인</text>

  <!-- 1 -->
  <rect x="48" y="86" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g stroke="#0e6da8" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="124" x2="80" y2="124"/><line x1="92" y1="112" x2="92" y2="136"/>
    <line x1="104" y1="104" x2="104" y2="144"/><line x1="116" y1="114" x2="116" y2="134"/>
    <line x1="128" y1="100" x2="128" y2="148"/><line x1="140" y1="116" x2="140" y2="132"/>
    <line x1="152" y1="108" x2="152" y2="140"/>
  </g>
  <text class="t bx" x="184" y="118">음성 답변 녹음</text>
  <text class="t sm" x="184" y="145">16kHz · Z-score 정규화 · 노이즈 증강</text>

  <!-- arrow -->
  <path d="M400 168 L400 190 M390 180 L400 192 L410 180" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <rect x="48" y="200" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="80" y="212" width="86" height="52" rx="4" fill="#e2eef7"/>
    <rect x="84" y="248" width="10" height="12" fill="#0e6da8" opacity=".9"/>
    <rect x="96" y="238" width="10" height="22" fill="#0e6da8" opacity=".75"/>
    <rect x="108" y="226" width="10" height="34" fill="#0e6da8" opacity=".6"/>
    <rect x="120" y="232" width="10" height="28" fill="#0e6da8" opacity=".7"/>
    <rect x="132" y="220" width="10" height="40" fill="#0e6da8" opacity=".5"/>
    <rect x="144" y="242" width="10" height="18" fill="#0e6da8" opacity=".8"/>
  </g>
  <text class="t bx" x="184" y="232">log-Mel 스펙트로그램</text>
  <text class="t sm" x="184" y="259">128 Mel 필터 × 시간 프레임 T</text>

  <path d="M400 282 L400 304 M390 294 L400 306 L410 294" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <rect x="48" y="314" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g fill="#0e6da8">
    <rect x="80" y="330" width="16" height="44" rx="3" opacity=".35"/>
    <rect x="102" y="336" width="16" height="32" rx="3" opacity=".55"/>
    <rect x="124" y="342" width="16" height="20" rx="3" opacity=".75"/>
    <circle cx="156" cy="352" r="9" opacity=".9"/>
  </g>
  <text class="t bx" x="184" y="346">CNN 2블록 → LSTM 2층</text>
  <text class="t sm" x="184" y="373">지역적 음향 특징 추출 후 시간 흐름 학습</text>

  <path d="M400 396 L400 418 M390 408 L400 420 L410 408" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 -->
  <rect x="48" y="428" width="704" height="60" rx="12" fill="#0e6da8"/>
  <text class="t wt" x="80" y="457">감정 16클래스</text>
  <text class="t ws" x="80" y="479">성별 2 × 감정 8 · 검증 정확도 약 80%</text>
</svg>
