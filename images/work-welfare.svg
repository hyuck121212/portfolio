<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-label="복지찾기 구조 도식: 여섯 문항만 입력받아 서버에 저장하지 않고 프롬프트로만 쓰고, LLM이 정해진 JSON 형식으로 정책 세 건을 골라 요약한 뒤 챗봇 상담으로 이어진다.">
  <style>
    .t  { font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    .hd { font-size: 21px; font-weight: 700; fill: #16181d; }
    .bx { font-size: 24px; font-weight: 700; fill: #16181d; }
    .sm { font-size: 17px; fill: #565c66; }
    .wt { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 17px; fill: #cfe4f2; }
  </style>
  <rect width="800" height="500" fill="#f4f6fa"/>
  <text class="t hd" x="48" y="56">검색 대신 여섯 문항으로 찾는 복지 정책</text>

  <!-- 1 -->
  <rect x="48" y="86" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="82" y="102" width="58" height="44" rx="6" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
    <rect x="92" y="112" width="38" height="5" rx="2.5" fill="#0e6da8" opacity=".7"/>
    <rect x="92" y="123" width="30" height="5" rx="2.5" fill="#0e6da8" opacity=".45"/>
    <rect x="92" y="134" width="34" height="5" rx="2.5" fill="#0e6da8" opacity=".45"/>
  </g>
  <text class="t bx" x="168" y="118">여섯 문항 입력</text>
  <text class="t sm" x="168" y="145">성별 · 나이 · 거주지역 · 직업 · 월소득</text>

  <path d="M400 168 L400 190 M390 180 L400 192 L410 180" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <rect x="48" y="200" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="84" y="222" width="52" height="34" rx="6" fill="#e2eef7" stroke="#0e6da8" stroke-width="2"/>
    <path d="M110 222 v-8" stroke="#0e6da8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M97 238 h26" stroke="#0e6da8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M97 247 h17" stroke="#0e6da8" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
  </g>
  <text class="t bx" x="168" y="232">입력값을 프롬프트로만 사용</text>
  <text class="t sm" x="168" y="259">서버에 저장하지 않아 유출될 개인정보 자체가 없음</text>

  <path d="M400 282 L400 304 M390 294 L400 306 L410 294" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <rect x="48" y="314" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="82" y="330" width="58" height="46" rx="6" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
    <rect x="90" y="339" width="42" height="8" rx="3" fill="#0e6da8" opacity=".85"/>
    <rect x="90" y="351" width="42" height="8" rx="3" fill="#0e6da8" opacity=".55"/>
    <rect x="90" y="363" width="42" height="8" rx="3" fill="#0e6da8" opacity=".3"/>
  </g>
  <text class="t bx" x="168" y="346">정책 3건 선별 · 요약</text>
  <text class="t sm" x="168" y="373">LLM 응답을 정해진 JSON 형식으로 받아 화면에 그대로 연결</text>

  <path d="M400 396 L400 418 M390 408 L400 420 L410 408" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 -->
  <rect x="48" y="428" width="704" height="60" rx="12" fill="#0e6da8"/>
  <text class="t wt" x="80" y="457">추천 정책에 대한 챗봇 상담</text>
  <text class="t ws" x="80" y="479">양식 작성이 어려운 사용자는 대화만으로도 추천을 받을 수 있음</text>
</svg>
