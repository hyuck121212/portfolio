<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"
     aria-label="약을 먹자 구조 도식: 약봉투 사진을 GPT-4o Vision으로 인식해 약 이름과 복용 횟수를 구조화하고, 복약 일정을 만들어 알림과 챗봇으로 연결한다.">
  <style>
    .t  { font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
    .hd { font-size: 21px; font-weight: 700; fill: #16181d; }
    .bx { font-size: 24px; font-weight: 700; fill: #16181d; }
    .sm { font-size: 17px; fill: #565c66; }
    .wt { font-size: 24px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 17px; fill: #cfe4f2; }
  </style>
  <rect width="800" height="500" fill="#f4f6fa"/>
  <text class="t hd" x="48" y="56">약봉투 한 장으로 복약 일정 만들기</text>

  <!-- 1 -->
  <rect x="48" y="86" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="82" y="104" width="58" height="40" rx="6" fill="#e2eef7" stroke="#0e6da8" stroke-width="2"/>
    <rect x="92" y="114" width="38" height="5" rx="2.5" fill="#0e6da8" opacity=".55"/>
    <rect x="92" y="124" width="28" height="5" rx="2.5" fill="#0e6da8" opacity=".4"/>
    <rect x="92" y="134" width="33" height="5" rx="2.5" fill="#0e6da8" opacity=".4"/>
  </g>
  <text class="t bx" x="168" y="118">약봉투 사진 촬영</text>
  <text class="t sm" x="168" y="145">고령층이 직접 찍어 올리는 한 단계</text>

  <path d="M400 168 L400 190 M390 180 L400 192 L410 180" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <rect x="48" y="200" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <circle cx="110" cy="238" r="24" fill="none" stroke="#0e6da8" stroke-width="3"/>
    <line x1="128" y1="256" x2="142" y2="270" stroke="#0e6da8" stroke-width="4" stroke-linecap="round"/>
    <rect x="98" y="228" width="24" height="4" rx="2" fill="#0e6da8" opacity=".7"/>
    <rect x="98" y="238" width="18" height="4" rx="2" fill="#0e6da8" opacity=".5"/>
  </g>
  <text class="t bx" x="168" y="232">GPT-4o Vision 약봉투 인식</text>
  <text class="t sm" x="168" y="259">약 이름 · 1일 복용 횟수 · 총 복용 일수로 구조화</text>

  <path d="M400 282 L400 304 M390 294 L400 306 L410 294" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <rect x="48" y="314" width="704" height="76" rx="12" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.5"/>
  <g>
    <rect x="82" y="330" width="58" height="46" rx="6" fill="#ffffff" stroke="#c9d0db" stroke-width="2"/>
    <line x1="82" y1="342" x2="140" y2="342" stroke="#c9d0db" stroke-width="2"/>
    <rect x="89" y="348" width="9" height="9" rx="2" fill="#0e6da8" opacity=".85"/>
    <rect x="102" y="348" width="9" height="9" rx="2" fill="#0e6da8" opacity=".5"/>
    <rect x="115" y="348" width="9" height="9" rx="2" fill="#dde2ea"/>
    <rect x="89" y="361" width="9" height="9" rx="2" fill="#0e6da8" opacity=".5"/>
    <rect x="102" y="361" width="9" height="9" rx="2" fill="#dde2ea"/>
    <rect x="115" y="361" width="9" height="9" rx="2" fill="#dde2ea"/>
  </g>
  <text class="t bx" x="168" y="346">오늘의 약 · 이달의 약</text>
  <text class="t sm" x="168" y="373">복약 일정 생성 · 기간별 복약 내역 조회</text>

  <path d="M400 396 L400 418 M390 408 L400 420 L410 408" fill="none" stroke="#9aa3b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4 -->
  <rect x="48" y="428" width="704" height="60" rx="12" fill="#0e6da8"/>
  <text class="t wt" x="80" y="457">푸시 · SMS 알림 + 복약 상담 챗봇</text>
  <text class="t ws" x="80" y="479">GPT-4o-mini · 가독성을 높인 고령층 대상 UI</text>
</svg>
